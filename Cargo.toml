[workspace]
resolver = "2"
members = ["kernel", "user/shell"]

[workspace.lints.rust]
missing_docs                   = "deny"
missing_debug_implementations  = "deny"
unused_results                 = "deny"
rust_2018_idioms               = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Strong baseline
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

# Strictness on panics / WIP code
unwrap_used   = "deny"
expect_used   = "deny"
todo          = "deny"
unimplemented = "deny"

# Style/naming — genuinely noisy for kernel/hardware code
module_name_repetitions = "allow"
similar_names           = "allow"
unreadable_literal      = "allow"   # hardware masks: 0xFFFF0000, etc.
many_single_char_names  = "allow"

# Cast allows — kernel arithmetic requires intentional truncation,
# sign manipulation, and pointer-width casts across the board.
cast_precision_loss      = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
cast_possible_wrap       = "allow"
cast_lossless            = "allow"

# Raw pointer / unsafe allows — this is a kernel
ptr_as_ptr               = "allow"  # *const/*mut casts are pervasive
ref_as_ptr               = "allow"  # &T as *const T is idiomatic kernel code
borrow_as_ptr            = "allow"
as_ptr_cast_mut          = "allow"

# Docs — backtick enforcement in doc comments
doc_markdown             = "allow"

# Nursery false positives
option_if_let_else       = "allow"  # match/if-let is often clearer
redundant_pub_crate      = "allow"

# Kernel functions can be large
too_many_lines           = "allow"
cognitive_complexity     = "allow"

[workspace.lints.rustdoc]
all                      = "deny"
missing_crate_level_docs = "deny"
broken_intra_doc_links   = "deny"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
